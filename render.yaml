services:
  - type: web
    name: lume-cosmetics
    env: python
    buildCommand: "./build.sh"
    startCommand: "cd backend && gunicorn app:app"
    disk:
      name: sqlite-data
      mountPath: /opt/render/project/src/backend/instance
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
